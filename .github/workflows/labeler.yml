name: labeler

on:
  pull_request_target: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4

      - name: label
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
